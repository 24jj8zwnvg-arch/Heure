<title>Suivi des heures</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#667085;--bd:#e1e4e8;--ac:#2563eb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1d2127;--tx:#eceff3;--mut:#9aa3af;--bd:#30363d;--ac:#60a5fa;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}}
:root[data-theme="dark"]{--bg:#14171c;--card:#1d2127;--tx:#eceff3;--mut:#9aa3af;--bd:#30363d;--ac:#60a5fa;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{-webkit-user-select:none;user-select:none;overscroll-behavior-y:none;margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
.w{max-width:760px;margin:0 auto}
h1{font-size:20px;margin:0 0 12px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.nav b{font-size:15px;text-align:center}
button{min-height:44px;min-width:44px;touch-action:manipulation;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.big{font-size:40px;font-weight:700}
.row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--mut);font-size:14px}
.bar{position:relative;height:14px;background:var(--bd);border-radius:7px;margin:12px 0 6px;overflow:hidden}
.fill{height:100%;background:var(--ac);width:0;transition:width .2s}
.mk{position:absolute;top:0;bottom:0;width:2px;background:var(--tx);opacity:.5}
.day{border-top:1px solid var(--bd);padding:12px 0}
.day:first-child{border-top:0}
.dh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.dh b{font-size:16px}
.f{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
input{-webkit-user-select:text;user-select:text}
label{font-size:12px;color:var(--mut);display:block}
input{width:100%;min-height:44px;-webkit-appearance:none;appearance:none;font-size:16px;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.i{font-size:13px;margin-top:8px;color:var(--mut)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
</style>
</head>
<body>
<div class="w">
<h1>Suivi des heures</h1>
<div class="nav"><button id="prev">←</button><b id="wk"></b><button id="next">→</button></div>
<div class="card">
<div class="row"><span>Cumul de la semaine</span><span id="stat"></span></div>
<div class="big" id="tot">0h00</div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div class="row"><span>0h</span><span>Plafond 35h</span></div>
<div class="i" id="sum"></div>
<div class="row" style="margin-top:12px"><span>Avance de la semaine (au-dessus du minimum du jour)</span></div>
<div class="big ok" id="adv" style="font-size:28px">+0h00</div>
</div>
<div class="card" id="days"></div>
<div class="row"><span>Pause par défaut (dès 12h) : <input id="dp" type="number" min="35" step="5" value="35" style="width:70px;display:inline"> min</span><button id="rst">Vider la semaine</button></div>
</div>
<script>
var DAYS=["Lundi","Mardi","Mercredi","Jeudi","Vendredi"];
var MINDAY=[450,450,450,450,360], EARLY_DEP=[900,900,900,900,840], EARLY_ARR=390, WMAX=2100, PMIN=35;
var off=0, data={}, defPause=35;
function sg(k){try{return localStorage.getItem(k)}catch(e){return null}}
function ss(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function mon(o){var d=new Date();d.setHours(12,0,0,0);var w=(d.getDay()+6)%7;d.setDate(d.getDate()-w+o*7);return d}
function key(){var d=mon(off);return "h:"+d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function load(){var r=sg(key());try{data=r?JSON.parse(r):{}}catch(e){data={}}var p=sg("h:pause2");if(p!==null&&!isNaN(+p))defPause=Math.max(+p,PMIN)}
function save(){ss(key(),JSON.stringify(data))}
function tm(s){if(!s)return null;var a=s.split(":");return +a[0]*60+ +a[1]}
function fm(m){var s=m<0?"-":"";m=Math.abs(Math.round(m));return s+Math.floor(m/60)+"h"+String(m%60).padStart(2,"0")}
function ft(m){return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}
function render(){
 var d0=mon(off),d4=new Date(d0);d4.setDate(d4.getDate()+4);
 var o={day:"numeric",month:"short"};
 document.getElementById("wk").textContent="Semaine du "+d0.toLocaleDateString("fr-FR",o)+" au "+d4.toLocaleDateString("fr-FR",o);
 document.getElementById("dp").value=defPause;
 var h="";
 for(var i=0;i<5;i++){
  var r=data[i]||{};
  var p=(r.p===undefined||r.p==="")?defPause:+r.p;
  h+='<div class="day"><div class="dh"><b>'+DAYS[i]+'</b><span id="n'+i+'"></span></div><div class="f">'
  +'<div><label>Arrivée</label><input type="time" data-i="'+i+'" data-k="a" value="'+(r.a||"")+'"></div>'
  +'<div><label>Départ</label><input type="time" data-i="'+i+'" data-k="d" value="'+(r.d||"")+'"></div>'
  +'<div><label>Pause dès 12h (min 35)</label><input type="number" min="0" step="5" data-i="'+i+'" data-k="p" value="'+p+'"></div>'
  +'</div><div class="i" id="m'+i+'"></div></div>';
 }
 document.getElementById("days").innerHTML=h;
 var els=document.querySelectorAll("#days input");
 for(var j=0;j<els.length;j++)els[j].addEventListener("input",function(e){var t=e.target,i=t.getAttribute("data-i");data[i]=data[i]||{};data[i][t.getAttribute("k")||t.getAttribute("data-k")]=t.value;save();calc()});
 calc();
}
function calc(){
 var tot=0,done=0,remMin=0,adv=0;
 for(var i=0;i<5;i++){
  var r=data[i]||{},a=tm(r.a),d=tm(r.d),p=(r.p===undefined||r.p==="")?defPause:+r.p;
  var n=document.getElementById("n"+i),m=document.getElementById("m"+i),msg=[];
  if(a!==null&&d!==null&&d>a){
   var net=d-a-p;tot+=Math.max(net,0);done++;
   n.textContent=fm(net)+" / "+fm(MINDAY[i]);
   n.className=net>=MINDAY[i]?"ok":"bad";
   if(net<MINDAY[i])msg.push('<span class="bad">Il manque '+fm(MINDAY[i]-net)+' pour le minimum du jour.</span>');
   if(p<PMIN)msg.push('<span class="bad">Pause inférieure à 35 min.</span>');
   var ex=Math.max(net-MINDAY[i],0);adv+=ex;msg.push('Avance du jour : <b class="ok">+'+fm(ex)+'</b> · Avance cumulée : <b class="ok">+'+fm(adv)+'</b>');msg.push('Cumul : <b>'+fm(tot)+'</b> / 35h00');
   if(a<EARLY_ARR)msg.push('<span class="warn">Arrivée avant 6h30.</span>');
   if(d<EARLY_DEP[i])msg.push('<span class="warn">Départ avant '+ft(EARLY_DEP[i])+'.</span>');
  }else{
   n.textContent="—";n.className="";
   remMin+=MINDAY[i];
   if(a!==null){var g=Math.max(a+p+MINDAY[i],EARLY_DEP[i]);msg.push("Départ conseillé : <b>"+ft(g)+"</b> (minimum du jour + heure de départ autorisée).")}
   else msg.push("Renseigne l’arrivée et le départ.");
  }
  m.innerHTML=msg.join(" ");
 }
 document.getElementById("tot").textContent=fm(tot);
 document.getElementById("adv").textContent="+"+fm(adv);
 document.getElementById("fill").style.width=Math.min(tot/WMAX*100,100)+"%";
 var st=document.getElementById("stat"),s=document.getElementById("sum");
 if(tot>WMAX){st.textContent="Dépassement";st.className="bad";s.innerHTML='<span class="bad">Au-dessus du maximum de '+fm(tot-WMAX)+'.</span>'}
 else if(tot>=WMAX){st.textContent="Plafond atteint";st.className="warn";s.innerHTML='Plafond de 35h atteint pile.'}
 else{st.textContent="En cours";st.className="ok";s.innerHTML='Reste <b>'+fm(WMAX-tot)+'</b> avant le plafond de 35h.'}
}
document.getElementById("prev").onclick=function(){off--;load();render()};
document.getElementById("next").onclick=function(){off++;load();render()};
document.getElementById("dp").oninput=function(e){defPause=Math.max(+e.target.value||0,PMIN);ss("h:pause2",defPause);calc()};
document.getElementById("rst").onclick=function(){data={};save();render()};
load();render();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
</body>
</html>
